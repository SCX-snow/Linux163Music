<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; frame-src https://music.163.com"
    />
    <title>163音乐</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      [id="netease"] {
        display: flex;
        width: 100%;
        height: 100%;
      }
      #settings-btn {
        position: fixed;
        top: 4px;
        right: 4px;
        z-index: 100;
        width: 30px;
        height: 30px;
        border: none;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.35);
        color: rgba(255, 255, 255, 0.7);
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        backdrop-filter: blur(2px);
        transition:
          background 0.2s,
          color 0.2s;
      }
      #settings-btn:hover {
        background: rgba(0, 0, 0, 0.6);
        color: #fff;
      }
      .settings-overlay {
        position: fixed;
        inset: 0;
        z-index: 200;
        background: rgba(0, 0, 0, 0.4);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.25s,
          visibility 0.25s;
      }
      .settings-overlay.open {
        opacity: 1;
        visibility: visible;
      }
      .settings-panel {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 210;
        width: 380px;
        height: 100%;
        background: #1a1a2e;
        color: #e0e0e0;
        padding: 24px;
        overflow-y: auto;
        transform: translateX(100%);
        transition: transform 0.3s ease;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        user-select: none;
      }
      .settings-panel.open {
        transform: translateX(0);
      }
      .settings-panel h1 {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 20px;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .settings-panel h1 button {
        background: none;
        border: none;
        color: #888;
        font-size: 20px;
        cursor: pointer;
        padding: 4px 8px;
        border-radius: 4px;
      }
      .settings-panel h1 button:hover {
        color: #fff;
        background: #2a2a3e;
      }
      .section {
        margin-bottom: 20px;
      }
      .section-title {
        font-size: 13px;
        font-weight: 500;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 10px;
      }
      .setting-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #2a2a3e;
      }
      .setting-row:last-child {
        border-bottom: none;
      }
      .setting-label {
        font-size: 14px;
      }
      .setting-desc {
        font-size: 12px;
        color: #888;
        margin-top: 2px;
      }
      .toggle {
        position: relative;
        width: 40px;
        height: 22px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .toggle input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle .slider {
        position: absolute;
        inset: 0;
        background: #444;
        border-radius: 22px;
        transition: background 0.2s;
      }
      .toggle .slider::before {
        content: "";
        position: absolute;
        width: 18px;
        height: 18px;
        left: 2px;
        bottom: 2px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.2s;
      }
      .toggle input:checked + .slider {
        background: #4caf50;
      }
      .toggle input:checked + .slider::before {
        transform: translateX(18px);
      }
      .btn-group {
        display: flex;
        gap: 6px;
      }
      .btn-group button {
        padding: 6px 14px;
        border: 1px solid #444;
        border-radius: 6px;
        background: transparent;
        color: #ccc;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.15s;
      }
      .btn-group button:hover {
        border-color: #666;
        background: #2a2a3e;
      }
      .btn-group button.active {
        border-color: #4caf50;
        color: #4caf50;
        background: #1a3a1e;
      }
      .color-options {
        display: flex;
        gap: 8px;
      }
      .color-swatch {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2px solid transparent;
        cursor: pointer;
        transition: border-color 0.15s;
      }
      .color-swatch:hover {
        border-color: #666;
      }
      .color-swatch.active {
        border-color: #fff;
      }
    </style>
  </head>
  <body>
    <webview
      id="netease"
      src="https://music.163.com/st/webplayer"
      preload="./preload/inject.js"
      allowpopups
      style="width: 100%; height: 100%"
    ></webview>

    <button id="settings-btn" title="设置 (Ctrl+,)">⚙</button>

    <div class="settings-overlay" id="settings-overlay"></div>

    <aside class="settings-panel" id="settings-panel">
      <h1>⚙ 设置<button id="settings-close" title="关闭">✕</button></h1>

      <div class="section">
        <div class="section-title">桌面歌词</div>
        <div class="setting-row">
          <div>
            <div class="setting-label">显示桌面歌词</div>
            <div class="setting-desc">在桌面独立窗口显示歌词</div>
          </div>
          <label class="toggle" aria-label="显示桌面歌词"
            ><input type="checkbox" id="lyrics-enabled" /><span
              class="slider"
            ></span
          ></label>
        </div>
        <div class="setting-row">
          <div class="setting-label">歌词字体大小</div>
          <div class="btn-group" id="font-size">
            <button data-value="small">小</button>
            <button data-value="medium" class="active">中</button>
            <button data-value="large">大</button>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-label">歌词颜色</div>
          <div class="color-options" id="lyrics-color">
            <span
              class="color-swatch active"
              data-value="#ffffff"
              style="background: #fff"
            ></span>
            <span
              class="color-swatch"
              data-value="#00e5ff"
              style="background: #00e5ff"
            ></span>
            <span
              class="color-swatch"
              data-value="#ff80ab"
              style="background: #ff80ab"
            ></span>
            <span
              class="color-swatch"
              data-value="#ffd740"
              style="background: #ffd740"
            ></span>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">窗口</div>
        <div class="setting-row">
          <div>
            <div class="setting-label">窗口置顶</div>
            <div class="setting-desc">主窗口始终在其他窗口之上</div>
          </div>
          <label class="toggle" aria-label="窗口置顶"
            ><input type="checkbox" id="always-on-top" /><span
              class="slider"
            ></span
          ></label>
        </div>
        <div class="setting-row">
          <div>
            <div class="setting-label">锁定歌词窗口</div>
            <div class="setting-desc">锁定时鼠标穿透，不可拖拽</div>
          </div>
          <label class="toggle" aria-label="锁定歌词窗口"
            ><input type="checkbox" id="lyrics-locked" checked /><span
              class="slider"
            ></span
          ></label>
        </div>
      </div>
    </aside>

    <script>
      const webview = document.getElementById("netease");
      const overlay = document.getElementById("settings-overlay");
      const panel = document.getElementById("settings-panel");

      function openSettings() {
        panel.classList.add("open");
        overlay.classList.add("open");
        loadCurrentSettings();
      }
      function closeSettings() {
        panel.classList.remove("open");
        overlay.classList.remove("open");
      }

      document
        .getElementById("settings-btn")
        .addEventListener("click", openSettings);
      document
        .getElementById("settings-close")
        .addEventListener("click", closeSettings);
      overlay.addEventListener("click", closeSettings);

      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === ",") {
          e.preventDefault();
          panel.classList.contains("open") ? closeSettings() : openSettings();
        }
        if (e.key === "Escape" && panel.classList.contains("open"))
          closeSettings();
      });

      async function loadCurrentSettings() {
        try {
          const s = await globalThis.api.getSettings();
          setChecked("lyrics-enabled", s.lyricsEnabled);
          setChecked("always-on-top", s.alwaysOnTop);
          setChecked("lyrics-locked", s.lyricsLocked);
          document
            .querySelectorAll("#font-size button")
            .forEach((b) =>
              b.classList.toggle(
                "active",
                b.dataset.value === s.lyricsFontSize,
              ),
            );
          document
            .querySelectorAll("#lyrics-color .color-swatch")
            .forEach((el) =>
              el.classList.toggle("active", el.dataset.value === s.lyricsColor),
            );
        } catch (err) {
          console.error("加载设置失败", err);
        }
      }

      function setChecked(id, value) {
        document.getElementById(id).checked = !!value;
      }

      function onChange(key, value) {
        globalThis.api.onSettingChanged({ [key]: value });
      }

      document
        .getElementById("lyrics-enabled")
        .addEventListener("change", (e) =>
          onChange("lyricsEnabled", e.target.checked),
        );
      document.querySelectorAll("#font-size button").forEach((btn) => {
        btn.addEventListener("click", () => {
          document
            .querySelectorAll("#font-size button")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          onChange("lyricsFontSize", btn.dataset.value);
        });
      });
      document.querySelectorAll("#lyrics-color .color-swatch").forEach((el) => {
        el.addEventListener("click", () => {
          document
            .querySelectorAll("#lyrics-color .color-swatch")
            .forEach((s) => s.classList.remove("active"));
          el.classList.add("active");
          onChange("lyricsColor", el.dataset.value);
        });
      });
      document
        .getElementById("always-on-top")
        .addEventListener("change", (e) =>
          onChange("alwaysOnTop", e.target.checked),
        );
      document
        .getElementById("lyrics-locked")
        .addEventListener("change", (e) =>
          onChange("lyricsLocked", e.target.checked),
        );

      webview.addEventListener("ipc-message", (event) => {
        const ch = event.channel;
        const p = event.args[0];
        if (ch === "metadata-changed")
          globalThis.api.sendSongMetadata({ title: p.title || "" });
        else if (ch === "playback-state-changed")
          globalThis.api.sendPlaybackState(p.state);
      });

      globalThis.api.onOpenSettings(() => openSettings());
    </script>
  </body>
</html>
